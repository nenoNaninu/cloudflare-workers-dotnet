name: build-samples

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  WASI_SDK_RELEASE: "29"
  WASI_SDK_VERSION: "29.0"


jobs:
  build-samples:
    name: Build samples
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install WASI SDK
        shell: bash
        run: |
          archive="$RUNNER_TEMP/wasi-sdk.tar.gz"
          sdk="$RUNNER_TEMP/wasi-sdk-${WASI_SDK_VERSION}-x86_64-linux"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_RELEASE}/wasi-sdk-${WASI_SDK_VERSION}-x86_64-linux.tar.gz"
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          test -d "$sdk/share/wasi-sysroot"
          echo "WASI_SDK_PATH=$sdk" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore samples/HelloWorker/HelloWorker.csproj

      - name: Publish
        run: dotnet publish samples/HelloWorker/HelloWorker.csproj --configuration Release --no-restore
